<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 420" width="740" height="420" font-family="Avenir Next, Segoe UI, system-ui, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="none" stroke="#333" stroke-width="2"/>
    </marker>
    <marker id="arrow-back" markerWidth="8" markerHeight="6" refX="0" refY="3" orient="auto">
      <path d="M8,0 L0,3 L8,6" fill="none" stroke="#333" stroke-width="2"/>
    </marker>
  </defs>

  <!-- Robot boundary -->
  <rect x="270" y="16" width="454" height="388" rx="14" fill="#fef6e8" stroke="#c4943a" stroke-width="2.5"/>
  <text x="284" y="38" font-size="14" font-weight="700" fill="#9a7400" letter-spacing="0.05em">ROBOT</text>

  <!-- Contract box -->
  <rect x="288" y="52" width="418" height="200" rx="10" fill="#fff" stroke="#c4943a" stroke-width="1.8" stroke-dasharray="8,4"/>
  <text x="302" y="72" font-size="13" font-weight="700" fill="#9a7400">Contract</text>

  <!-- Skill Library -->
  <rect x="300" y="84" width="124" height="120" rx="8" fill="#EFDACA" stroke="#BF5700" stroke-width="1.8"/>
  <text x="362" y="104" text-anchor="middle" font-size="12" font-weight="700" fill="#172033">Skill Library</text>
  <line x1="316" y1="112" x2="408" y2="112" stroke="#B0723F" stroke-width="1"/>
  <text font-weight="600" x="362" y="128" text-anchor="middle" font-size="11" fill="#1a1917">Navigate</text>
  <text font-weight="600" x="362" y="142" text-anchor="middle" font-size="11" fill="#1a1917">Detect · Pick · Place</text>
  <text font-weight="600" x="362" y="156" text-anchor="middle" font-size="11" fill="#1a1917">Open · Close</text>
  <text font-weight="600" x="362" y="190" text-anchor="middle" font-size="10" fill="#554b41" font-style="italic">typed param schemas</text>

  <!-- BT Operators -->
  <rect x="436" y="84" width="124" height="120" rx="8" fill="#EFDACA" stroke="#BF5700" stroke-width="1.8"/>
  <text x="498" y="104" text-anchor="middle" font-size="12" font-weight="700" fill="#172033">BT Operators</text>
  <line x1="452" y1="112" x2="544" y2="112" stroke="#B0723F" stroke-width="1"/>
  <text font-weight="600" x="498" y="128" text-anchor="middle" font-size="11" fill="#1a1917">Sequence</text>
  <text font-weight="600" x="498" y="142" text-anchor="middle" font-size="11" fill="#1a1917">Selector</text>
  <text font-weight="600" x="498" y="156" text-anchor="middle" font-size="11" fill="#1a1917">Parallel · Condition</text>
  <text font-weight="600" x="498" y="190" text-anchor="middle" font-size="10" fill="#554b41" font-style="italic">permitted node set</text>

  <!-- Rootstocks -->
  <rect x="572" y="84" width="124" height="120" rx="8" fill="#EFDACA" stroke="#BF5700" stroke-width="1.8"/>
  <text x="634" y="104" text-anchor="middle" font-size="12" font-weight="700" fill="#172033">Rootstocks</text>
  <line x1="588" y1="112" x2="680" y2="112" stroke="#B0723F" stroke-width="1"/>
  <text font-weight="600" x="634" y="128" text-anchor="middle" font-size="11" fill="#1a1917">detect_pick</text>
  <text font-weight="600" x="634" y="142" text-anchor="middle" font-size="11" fill="#1a1917">search_pick_selector</text>
  <text font-weight="600" x="634" y="156" text-anchor="middle" font-size="11" fill="#1a1917">search_pick_deliver</text>
  <text font-weight="600" x="634" y="170" text-anchor="middle" font-size="11" fill="#1a1917">retrieve_and_restore</text>
  <text font-weight="600" x="634" y="190" text-anchor="middle" font-size="10" fill="#554b41" font-style="italic">templated BT fragments</text>

  <!-- World Vocabulary -->
  <rect x="300" y="216" width="396" height="28" rx="6" fill="#f0f0f0" stroke="#7c8391" stroke-width="1.4"/>
  <text font-weight="600" x="498" y="235" text-anchor="middle" font-size="11" fill="#3d3833">World Vocabulary: rooms, objects, locations, hallways</text>

  <!-- Task prompt -->
  <rect x="12" y="60" width="176" height="100" rx="8" fill="#f8f8f8" stroke="#8a8a8a" stroke-width="1.8"/>
  <text x="22" y="80" font-size="11" fill="#3d3833" font-weight="700">NL Task Prompt</text>
  <text font-weight="600" x="22" y="98" font-size="12" fill="#1a1917" font-style="italic">"Search pantry, then</text>
  <text font-weight="600" x="22" y="114" font-size="12" fill="#1a1917" font-style="italic">fridge for bread.</text>
  <text font-weight="600" x="22" y="130" font-size="12" fill="#1a1917" font-style="italic">If found, pick it up."</text>

  <!-- Arrow: prompt → agent -->
  <line x1="100" y1="160" x2="100" y2="210" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Coding Agent -->
  <rect x="28" y="218" width="144" height="76" rx="10" fill="#1a1917" stroke="#1a1917" stroke-width="1.8"/>
  <text x="100" y="248" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">Coding Agent</text>
  <text font-weight="600" x="100" y="268" text-anchor="middle" font-size="11" fill="#e0e0e0">synthesizes BT spec</text>

  <!-- Arrow: agent ←── query contract (L-shaped: right then up) -->
  <path d="M172,238 L200,238 L200,150 L288,150" fill="none" stroke="#333" stroke-width="2" marker-start="url(#arrow-back)"/>
  <text x="208" y="190" font-size="11" fill="#3d3833" font-weight="700">query</text>
  <text x="208" y="202" font-size="11" fill="#3d3833" font-weight="700">contract</text>

  <!-- Arrow: agent ──> send BT (L-shaped: down then right) -->
  <path d="M172,272 L200,272 L200,340 L340,340" fill="none" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="208" y="308" font-size="11" fill="#3d3833" font-weight="700">send</text>
  <text x="208" y="320" font-size="11" fill="#3d3833" font-weight="700">BT spec</text>

  <!-- Validation Gate -->
  <rect x="342" y="310" width="148" height="60" rx="8" fill="#d4edda" stroke="#1e6e28" stroke-width="2"/>
  <text x="416" y="334" text-anchor="middle" font-size="12" font-weight="700" fill="#1e6e28">Validation Gate</text>
  <text font-style="italic" font-weight="600" x="416" y="350" text-anchor="middle" font-size="10.5" fill="#1a5a26">schema · skills · params</text>

  <!-- Arrow: validation → runtime -->
  <line x1="490" y1="340" x2="540" y2="340" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- BT Runtime -->
  <rect x="548" y="310" width="148" height="60" rx="8" fill="#e5e8ee" stroke="#7c8391" stroke-width="2"/>
  <text x="622" y="334" text-anchor="middle" font-size="12" font-weight="700" fill="#172033">BT Runtime</text>
  <text font-style="italic" font-weight="600" x="622" y="350" text-anchor="middle" font-size="10.5" fill="#3d3833">execute</text>

  <!-- Retry arrow (routes below validation gate, back to agent) -->
  <path d="M342,358 L300,358 L300,395 L120,395 L120,296" fill="none" stroke="#91202a" stroke-width="1.8" stroke-dasharray="6,4" marker-end="url(#arrow)"/>
  <text font-weight="600" x="190" y="390" font-size="10" fill="#91202a" font-style="italic">retry if invalid</text>

  <!-- MCP labels on the robot boundary -->
  <rect x="254" y="141" width="36" height="18" rx="4" fill="#fff" stroke="#c4943a" stroke-width="1.4"/>
  <text x="272" y="154" text-anchor="middle" font-size="10" font-weight="700" fill="#9a7400">MCP</text>

  <rect x="254" y="331" width="36" height="18" rx="4" fill="#fff" stroke="#c4943a" stroke-width="1.4"/>
  <text x="272" y="344" text-anchor="middle" font-size="10" font-weight="700" fill="#9a7400">MCP</text>
</svg>
